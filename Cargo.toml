[package]
name = "omacourses"
version = "0.1.0"
edition = "2021"
rust-version = "1.85"
authors = ["CloudDown"]
description = "Cahier — notes au stylet, pupitre Omarchy"
license = "MIT"
default-run = "cahier"

[[bin]]
name = "cahier"
path = "src/main.rs"

[dependencies]
eframe = { version = "0.32", default-features = false, features = ["default_fonts", "glow", "wayland", "x11", "accesskit"] }
egui = "0.32"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"
uuid = { version = "1", features = ["v4", "serde"] }
chrono = { version = "0.4", features = ["serde", "clock"] }
directories = "6"
rfd = "0.15"
image = { version = "0.25", default-features = false, features = ["png", "jpeg"] }
tiny-skia = "0.11"
fontdue = "0.9"
flate2 = "1"
arboard = "3"
